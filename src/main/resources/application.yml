spring:
  application:
    name: multitenant-auth-api
  profiles:
    active: dev
  datasource:
    url: jdbc:postgresql://localhost:5432/${POSTGRES_DB:multitenant_auth}
    username: ${POSTGRES_USER:auth_user}
    password: ${POSTGRES_PASSWORD:changeme}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true

server:
  port: 8080

app:
  jwt:
    issuer: multitenant-auth-api
    access-token-expiration-minutes: 15
    refresh-token-expiration-days: 7